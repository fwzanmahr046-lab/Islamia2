name: Islamic App Continuous Integration & Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Production APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Analyze Flutter Project Code
        run: flutter analyze

      - name: Generate Android Project Structure
        run: flutter create . --platforms=android --org com.example.islamicapp

      - name: Build Debug APK File
        run: flutter build apk --debug

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslamicApp-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslamicApp-Debug-AAB
          path: build/app/outputs/bundle/debug/app-debug.aab
